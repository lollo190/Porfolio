<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorenzo Kraja — Product & Jewelry Designer</title>
    <meta name="description" content="Product & Jewelry designer che esplora l'intersezione tra materia, scultura indossabile e design industriale.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Lorenzo Kraja — Product & Jewelry Designer">
    <meta property="og:description" content="Product & Jewelry designer che esplora l'intersezione tra materia, scultura indossabile e design industriale.">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Lorenzo Kraja — Product & Jewelry Designer">
    <meta name="twitter:description" content="Product & Jewelry designer che esplora l'intersezione tra materia, scultura indossabile e design industriale.">

    <meta name="view-transition" content="same-origin">
    <script>
        (function() {
            var t = sessionStorage.getItem('macos_space_transition');
            if (t === 'to_about') document.documentElement.dataset.vtDirection = 'forward';
            else if (t === 'to_portfolio') document.documentElement.dataset.vtDirection = 'backward';
            if (sessionStorage.getItem('site_intro_played')) {
                document.documentElement.classList.add('intro-already-played');
            }
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Site Intro Splash Overlay -->
    <div id="site-intro-overlay" class="site-intro-overlay" aria-label="Lorenzo Kraja Intro Splash" role="dialog" aria-modal="true">
        <div class="intro-film-grain" aria-hidden="true"></div>
        <div class="intro-logo-center">
            <span class="intro-logo-text">Lorenzo Kraja</span>
        </div>
    </div>

    <div class="film-grain" aria-hidden="true"></div>
    <div id="app"></div>

    <script src="js/main.js"></script>
</body>
</html>
