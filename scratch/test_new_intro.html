<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Film Grain Intro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f7f7f7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Intro Overlay */
        .site-intro-overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f7f7f7;
            overflow: hidden;
            cursor: pointer;
            transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                        visibility 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform, visibility;
        }

        .site-intro-overlay.is-faded {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.02);
        }

        /* Film Grain from Codepen https://codepen.io/ooblek/pen/vYxYomx */
        .intro-film-grain {
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background-image: url('../assets/noise.png');
            background-repeat: repeat;
            background-size: 512px 512px;
            opacity: 0.22;
            pointer-events: none;
            user-select: none;
            z-index: 1;
            animation: introAnimateGrain 8s steps(10) infinite;
            will-change: transform;
        }

        @keyframes introAnimateGrain {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -10%); }
            20% { transform: translate(-15%, -20%); }
            30% { transform: translate(-5%, -10%); }
            40% { transform: translate(-15%, -20%); }
            50% { transform: translate(-5%, -10%); }
            60% { transform: translate(-15%, -20%); }
            70% { transform: translate(-5%, -10%); }
            80% { transform: translate(-15%, -20%); }
            90% { transform: translate(-5%, -10%); }
        }

        .intro-logo-center {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            pointer-events: none;
            user-select: none;
        }

        /* Text in BLACK and 50% smaller (340px max-width) */
        .intro-logo-img {
            width: min(340px, 50vw);
            max-width: 340px;
            height: auto;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .site-intro-overlay.is-faded .intro-logo-img {
            transform: scale(0.96);
        }

        @media (max-width: 768px) {
            .intro-logo-img {
                width: min(210px, 55vw);
                max-width: 210px;
            }
        }
    </style>
</head>
<body>
    <div id="site-intro-overlay" class="site-intro-overlay">
        <div class="intro-film-grain" aria-hidden="true"></div>
        <div class="intro-logo-center">
            <img class="intro-logo-img" src="../assets/intro-logo-black.png" alt="Lorenzo Kraja" draggable="false">
        </div>
    </div>
</body>
</html>
