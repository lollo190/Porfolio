<!DOCTYPE html>
<html lang="it" data-vt-direction="forward">
<head>
<meta charset="UTF-8">
<meta name="view-transition" content="same-origin">
<style>
@view-transition { navigation: auto; }
body { margin: 0; background: #18191c; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }

::view-transition-old(root) { animation: macosSlideOutLeft 0.5s cubic-bezier(0.2, 0.9, 0.2, 1) both; }
::view-transition-new(root) { animation: macosSlideInRight 0.5s cubic-bezier(0.2, 0.9, 0.2, 1) both; }

@keyframes macosSlideOutLeft {
    0% { transform: translateX(0); opacity: 1; filter: brightness(1); }
    100% { transform: translateX(-100vw); opacity: 0.95; filter: brightness(0.92); }
}
@keyframes macosSlideInRight {
    0% { transform: translateX(100vw); opacity: 0.95; filter: brightness(0.92); }
    100% { transform: translateX(0); opacity: 1; filter: brightness(1); }
}

.macos-spaces-hud {
    view-transition-name: macos-hud;
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(30, 30, 32, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 30px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    z-index: 9999;
}

.macos-hud-dots { display: flex; gap: 6px; align-items: center; }
.macos-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); }
.macos-dot.active { background: #00c5d4; box-shadow: 0 0 8px #00c5d4; }
a { display: inline-block; padding: 14px 28px; background: #00c5d4; color: #000; text-decoration: none; border-radius: 999px; font-weight: 700; }
</style>
</head>
<body>
<div class="macos-spaces-hud">
    <span>SPACE 2 // ABOUT OS</span>
    <div class="macos-hud-dots">
        <span class="macos-dot"></span>
        <span class="macos-dot active"></span>
    </div>
</div>
<div style="text-align:center;">
    <h2>ABOUT OS WORKSPACE (Space 2)</h2>
    <a href="hud_page1.html" id="to-page-1">&larr; PORTFOLIO</a>
</div>
</body>
</html>
