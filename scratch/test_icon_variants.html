<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
    background: #f7f7f7;
    font-family: 'Space Mono', monospace;
    padding: 40px;
    display: flex;
    gap: 40px;
    align-items: flex-start;
}
.icon-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100px;
}
.icon-label {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    margin-top: 8px;
    color: #111;
    text-align: center;
}
.thumb-wrap {
    position: relative;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.badge {
    position: absolute;
    bottom: -2px;
    right: -4px;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 3px;
    line-height: 1.1;
    color: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
}
.badge-cyan { background: #00bcd4; }
.badge-txt-1 { background: #1e293b; }
.badge-txt-2 { background: #e11d48; }
.badge-txt-3 { background: #475569; }

/* Option A: Crisp macOS / TextEdit Paper Document */
.svg-doc-a {
    filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.16)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.1));
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.svg-doc-a:hover {
    transform: translateY(-2px) scale(1.04);
}
</style>
</head>
<body>

<!-- Reference: Projects folder -->
<div class="icon-box">
    <div class="thumb-wrap">
        <svg viewBox="0 0 54 44" width="58" height="46" fill="none" style="filter: drop-shadow(0 3px 6px rgba(0,0,0,0.18));">
            <path d="M4 8a3 3 0 0 1 3-3h13l4 4h23a3 3 0 0 1 3 3v24a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8z" fill="#0097a7" />
            <rect x="7" y="11" width="40" height="4" rx="1" fill="#00838f" opacity="0.6" />
            <path d="M3 15a3 3 0 0 1 3-3h42a3 3 0 0 1 3 3v21a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V15z" fill="#00c5d4" />
            <path d="M6 13h42a3 3 0 0 1 3 3v1H3v-1a3 3 0 0 1 3-3z" fill="#33d6e2" opacity="0.35" />
        </svg>
        <span class="badge badge-cyan">PROJ</span>
    </div>
    <span class="icon-label">Projects</span>
</div>

<!-- Option 1: Clean High-End Monolithic Document -->
<div class="icon-box">
    <div class="thumb-wrap">
        <svg class="svg-doc-a" viewBox="0 0 42 50" width="44" height="50" fill="none">
            <!-- Sheet shadow & body -->
            <path d="M4 3C4 1.89543 4.89543 1 6 1H28L38 11V47C38 48.1046 37.1046 49 36 49H6C4.89543 49 4 48.1046 4 47V3Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2" stroke-linejoin="round"/>
            <!-- Fold corner with inner shadow -->
            <path d="M28 1V9C28 10.1046 28.8954 11 30 11H38" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M28 1L38 11H30C28.8954 11 28 10.1046 28 9V1Z" fill="#E5E7EB"/>
            <!-- Subtle ruled lines (TextEdit lines) -->
            <rect x="9" y="18" width="24" height="2" rx="1" fill="#475569"/>
            <rect x="9" y="24" width="20" height="2" rx="1" fill="#94A3B8"/>
            <rect x="9" y="30" width="22" height="2" rx="1" fill="#94A3B8"/>
            <rect x="9" y="36" width="14" height="2" rx="1" fill="#CBD5E1"/>
        </svg>
        <span class="badge badge-txt-1">TXT</span>
    </div>
    <span class="icon-label">contact.txt</span>
</div>

<!-- Option 2: Virgil / Minimalist Document with subtle blue line -->
<div class="icon-box">
    <div class="thumb-wrap">
        <svg class="svg-doc-a" viewBox="0 0 42 50" width="44" height="50" fill="none">
            <path d="M4 3C4 1.89543 4.89543 1 6 1H28L38 11V47C38 48.1046 37.1046 49 36 49H6C4.89543 49 4 48.1046 4 47V3Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M28 1V9C28 10.1046 28.8954 11 30 11H38" fill="#F3F4F6" stroke="#111111" stroke-width="1.4" stroke-linejoin="round"/>
            <rect x="9" y="19" width="18" height="2.5" rx="1.25" fill="#007AFF"/>
            <rect x="9" y="26" width="24" height="1.8" rx="0.9" fill="#111111"/>
            <rect x="9" y="31" width="20" height="1.8" rx="0.9" fill="#111111"/>
            <rect x="9" y="36" width="15" height="1.8" rx="0.9" fill="#71717A"/>
        </svg>
        <span class="badge badge-txt-1" style="background:#111;">TXT</span>
    </div>
    <span class="icon-label">contact.txt</span>
</div>

</body>
</html>
