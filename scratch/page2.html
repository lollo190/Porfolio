<!DOCTYPE html>
<html>
<head>
<meta name="view-transition" content="same-origin">
<style>
@view-transition { navigation: auto; }
body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
::view-transition-old(root) { animation: slideOutRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
::view-transition-new(root) { animation: slideInLeft 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
@keyframes slideOutRight { from { transform: translateX(0); } to { transform: translateX(100%); } }
@keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
a { font-size: 24px; padding: 16px 32px; background: #00c5d4; color: #000; text-decoration: none; border-radius: 8px; font-weight: bold; }
</style>
</head>
<body>
<div style="text-align:center;">
  <h1>DESKTOP 2 (About OS)</h1>
  <a href="page1.html" id="link-to-1">&larr; Return to Desktop 1</a>
</div>
</body>
</html>
